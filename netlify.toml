[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Send every route to the SPA so /demo works on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
